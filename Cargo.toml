[workspace]
resolver = "3"
members = [
    "crates/agent-statistics",
    "crates/balance-detector",
    "crates/token-usage-detector",
]

[workspace.package]
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
repository = "https://github.com/Unka-Malloc/Agent-Statistics.git"

[workspace.dependencies]
token-usage-detector = { path = "crates/token-usage-detector", version = "0.1.1" }
anyhow = "1"
licoup-client-state = "0.3.0"
licoup-extension-contracts = "0.3.0"
licoup-foundation = "0.3.0"
licoup-model-catalog = "0.3.0"
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v4", "serde"] }
