[workspace]
resolver = "3"
members = ["crates/token-usage-detector", "crates/balance-detector"]

[workspace.package]
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
repository = "https://github.com/Unka-Malloc/Agent-Statistics.git"

[workspace.dependencies]
licoup-extension-contracts = "0.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
